<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bageshwar Dham Slider & Bhajan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7ed;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-height: 100vh;
      padding: 20px 14px;
    }

    .slider-container {
      position: relative;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
      background: #1f2937;
    }

    .slide {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide.active {
      display: block;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    .prev-btn {
      left: 12px;
    }

    .next-btn {
      right: 12px;
    }

    .dots-box {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      border: none;
      cursor: pointer;
    }

    .dot.active {
      background: #ffffff;
      transform: scale(1.2);
    }

    .prasad-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      max-width: 360px;
      width: 100%;
    }

    #laddu-img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .laddu-active {
      transform: scale(1.12);
      box-shadow: 0 0 0 5px rgba(249, 115, 22, 0.35);
    }

    #prasad-btn {
      background: #ea580c;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #prasad-btn:hover {
      background: #c2410c;
    }
  </style>
</head>
<body>
  <div class="slider-container" id="photo-slider">
    <img src="slide1.jpg" alt="Pandit Dhirendra Krishna Shastri" class="slide active" />
    <img src="slide2.jpg" alt="Bageshwar Dham event procession" class="slide" />
    <img src="slide3.jpg" alt="Acharya Dhirendra Krishna Shastri" class="slide" />

    <button type="button" class="slider-btn prev-btn" id="prev-slide" aria-label="Previous slide">&#8249;</button>
    <button type="button" class="slider-btn next-btn" id="next-slide" aria-label="Next slide">&#8250;</button>

    <div class="dots-box" id="slider-dots">
      <button type="button" class="dot active" data-index="0" aria-label="Slide 1"></button>
      <button type="button" class="dot" data-index="1" aria-label="Slide 2"></button>
      <button type="button" class="dot" data-index="2" aria-label="Slide 3"></button>
    </div>
  </div>

  <div class="prasad-box">
    <img id="laddu-img" src="laddu.jpg" alt="Laddu Prasad" />
    <button type="button" id="prasad-btn">Bhajan &amp; Laddu Prasad</button>
    <audio id="bhajan-audio" src="bhajan.mp3"></audio>
  </div>

  <script>
    // Slider logic
    const slides = document.querySelectorAll("#photo-slider .slide");
    const dots = document.querySelectorAll("#slider-dots .dot");
    const prevBtn = document.getElementById("prev-slide");
    const nextBtn = document.getElementById("next-slide");

    let currentIndex = 0;

    function showSlide(index) {
      currentIndex = (index + slides.length) % slides.length;

      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === currentIndex);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentIndex);
      });
    }

    prevBtn.addEventListener("click", () => {
      showSlide(currentIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      showSlide(currentIndex + 1);
    });

    dots.forEach((dot) => {
      dot.addEventListener("click", () => {
        showSlide(Number(dot.dataset.index));
      });
    });

    setInterval(() => {
      showSlide(currentIndex + 1);
    }, 4000);

    // Bhajan & Laddu toggle logic
    const prasadBtn = document.getElementById("prasad-btn");
    const ladduImg = document.getElementById("laddu-img");
    const bhajanAudio = document.getElementById("bhajan-audio");

    function triggerBhajanAndLaddu() {
      ladduImg.classList.remove("laddu-active");
      void ladduImg.offsetWidth;
      ladduImg.classList.add("laddu-active");

      if (!bhajanAudio) return;

      if (bhajanAudio.paused) {
        bhajanAudio.play().catch(() => {});
      } else {
        bhajanAudio.pause();
      }
    }

    prasadBtn.addEventListener("click", triggerBhajanAndLaddu);
    ladduImg.addEventListener("click", triggerBhajanAndLaddu);
  </script>
</body>
</html>
