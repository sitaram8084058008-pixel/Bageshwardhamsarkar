<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bageshwar Dham Photo Slider</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .slider-container {
      position: relative;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      background: #1f2937;
    }

    .slide {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .slide.active {
      display: block;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    .slider-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .prev-btn {
      left: 12px;
    }

    .next-btn {
      right: 12px;
    }

    .dots-box {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      cursor: pointer;
    }

    .dot.active {
      background: #ffffff;
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div class="slider-container" id="photo-slider">
    <img src="slide1.jpg" alt="Pandit Dhirendra Krishna Shastri" class="slide active" />
    <img src="slide2.jpg" alt="Bageshwar Dham event procession" class="slide" />
    <img src="slide3.jpg" alt="Acharya Dhirendra Krishna Shastri" class="slide" />

    <button type="button" class="slider-btn prev-btn" id="prev-slide" aria-label="Previous slide">&#8249;</button>
    <button type="button" class="slider-btn next-btn" id="next-slide" aria-label="Next slide">&#8250;</button>

    <div class="dots-box" id="slider-dots">
      <button type="button" class="dot active" data-index="0" aria-label="Slide 1"></button>
      <button type="button" class="dot" data-index="1" aria-label="Slide 2"></button>
      <button type="button" class="dot" data-index="2" aria-label="Slide 3"></button>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll("#photo-slider .slide");
    const dots = document.querySelectorAll("#slider-dots .dot");
    const prevBtn = document.getElementById("prev-slide");
    const nextBtn = document.getElementById("next-slide");

    let currentIndex = 0;

    function showSlide(index) {
      currentIndex = (index + slides.length) % slides.length;

      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === currentIndex);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentIndex);
      });
    }

    prevBtn.addEventListener("click", () => {
      showSlide(currentIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      showSlide(currentIndex + 1);
    });

    dots.forEach((dot) => {
      dot.addEventListener("click", () => {
        const idx = Number(dot.dataset.index);
        showSlide(idx);
      });
    });

    // Har 4 second mein agli slide par jane ke liye
    setInterval(() => {
      showSlide(currentIndex + 1);
    }, 4000);
  </script>
</body>
</html>
